name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['4.6.1']

    steps:
         # 1. Check out the repository
      - uses: actions/checkout@v4
         # 2. Check out the dependent repository
      - name: Checkout dependent repository
        uses: actions/checkout@v4
        with:
          repository: 'utaresearch/nwsrfs-hydro-models'
          path: nwsrfs-models
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libcurl4-openssl-dev
          sudo apt install gfortran
          sudo apt install libuv1-dev
          sudo apt-get install -y \
              libfontconfig1-dev \
              libfreetype6-dev \
              libharfbuzz-dev \
              libfribidi-dev \
              libpng-dev \
              libtiff5-dev \
              libjpeg-dev 
      - name: Install dependencies
        run: |
          packages <- c('xfun', 'import', 'ragg', 'RPostgres', 'gridExtra', 'fitdistrplus', 'hydroEvents', 'remotes', 'rcmdcheck', 'dplyr', 'box')
          install.packages(packages)
          install.packages("devtools", dependencies = c("Depends", "Imports", "LinkingTo"))
          remotes::install_deps(dependencies = TRUE)
          devtools::install('nwsrfs-models/nwsrfs_r')
        shell: Rscript {0}
      - name: Check
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-install"), error_on = "error")
        shell: Rscript {0}
      - name: Report the environment
        shell: bash
        run: Rscript -e 'sessionInfo(); cat("cores:", parallel::detectCores(), "\n")'
      - name: Calibrate 1 zone, period of record
        shell: bash
        run: Rscript run-controller.R --dir runs/1zone --basin GAST2 --objfun kge_NULL --lite --num_cores 2 --overwrite
